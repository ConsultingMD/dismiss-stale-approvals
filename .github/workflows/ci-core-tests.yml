name: core-tests

on:
  pull_request:
    types: [
        # Default pull_request trigger types.
        opened,
        synchronize,
        reopened,
      ]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell syntax
        run: bash -n ./*.sh ./tests/*.sh

      - name: Run ShellCheck
        run: shellcheck ./*.sh ./tests/*.sh

      - name: Run regression tests
        run: ./tests/run.sh
